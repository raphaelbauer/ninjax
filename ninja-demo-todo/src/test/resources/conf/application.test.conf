# Test configuration for ninja-demo-todo

# Random port for test server
ninja.port=0

# H2 in-memory database for testing
application.datasource.default.driver=org.h2.Driver
application.datasource.default.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
application.datasource.default.username=sa
application.datasource.default.password=

# Enable Flyway migrations for tests
application.datasource.default.migration.enabled=true
application.datasource.default.migration.locations=migrations/default
